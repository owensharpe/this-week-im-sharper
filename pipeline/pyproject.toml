[project]
name = "sharper-pipeline"
version = "0.1.0"
description = "Daily finance/markets/macro/geopolitics news pipeline for the this-week-im-sharper dashboard."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Owen Sharpe" }]
dependencies = [
    "feedparser>=6.0.10",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.5.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
sharper-pipeline = "sharper_pipeline.main:main"
sharper-pipeline-weekly = "sharper_pipeline.rollup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharper_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
