name: Markets data

on:
  schedule:
    # Tuesday to Saturday, 14:30 UTC. By then Treasury has published the
    # previous day's curve and FRED has the previous day's ICE closes, so each
    # run picks up one weekday's close for both.
    - cron: "30 14 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: markets-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Build markets snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv run sharper-markets

      - name: Commit snapshot
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/credit
          if git diff --staged --quiet; then
            echo "No new observations to commit."
            exit 0
          fi
          git commit -m "chore(markets): update $(date -u +%F)"
          # The digest job also pushes to main; rebase in case it got there first.
          git pull --rebase origin main
          git push origin HEAD:main
