name: Daily news digest

on:
  schedule:
    # 11:00 UTC = 07:00 ET (EDT) / 06:00 ET (EST)
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2-v1
          restore-keys: |
            hf-${{ runner.os }}-all-MiniLM-L6-v2-

      - name: Run daily pipeline
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run sharper-pipeline

      - name: Determine if Sunday
        id: dow
        run: echo "is_sunday=$([ "$(date -u +%u)" = "7" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Run weekly rollup (Sundays only)
        if: steps.dow.outputs.is_sunday == 'true'
        run: uv run sharper-pipeline-weekly

      - name: Commit digests
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/digests
          if git diff --staged --quiet; then
            echo "No digest changes to commit."
            exit 0
          fi
          git commit -m "chore(digests): update $(date -u +%F)"
          git push origin HEAD:main
