name: Daily news digest

on:
  # The daily run comes from Vercel Cron, which calls workflow_dispatch around
  # 09:00 UTC (see vercel.json and src/app/api/cron/digest). GitHub's scheduler
  # starts jobs hours late, so this schedule is only a fallback for a day that
  # call never arrived.
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  # A scheduled run stands down once today's digest is on main. Manual and
  # Vercel-dispatched runs always go ahead.
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.today.outputs.skip }}
    steps:
      - name: Checkout digests
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4
        with:
          sparse-checkout: content/digests

      - name: Look for today's digest
        id: today
        if: github.event_name == 'schedule'
        run: |
          file="content/digests/$(date -u +%F).json"
          if [ -f "$file" ]; then
            echo "$file is already on main; nothing for the fallback to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2-v1
          restore-keys: |
            hf-${{ runner.os }}-all-MiniLM-L6-v2-

      - name: Run daily pipeline
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_CALL_DELAY_S: "7"
        run: uv run sharper-pipeline

      - name: Commit digests
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/digests
          if git diff --staged --quiet; then
            echo "No digest changes to commit."
            exit 0
          fi
          git commit -m "chore(digests): update $(date -u +%F)"
          # The markets job also pushes to main; rebase in case it got there first.
          git pull --rebase origin main
          git push origin HEAD:main
